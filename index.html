<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CryptoCurrency Website</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-900 text-white">

    <!-- Navbar -->
    <nav class="flex justify-between items-center px-10 py-6">
        <img src="./assets/logo.jfif" class="w-12 rounded-full" />

        <ul class="flex gap-6 text-gray-300">
            <li><a href="#" onclick="alert('Coming Soon')">Market</a></li>
            <li><a href="#" onclick="alert('Coming Soon')">Features</a></li>
            <li><a href="#" onclick="alert('Coming Soon')">About</a></li>
        </ul>

        <span class="cursor-pointer">EN</span>
    </nav>

    <!-- Hero -->
    <section class="text-center mt-20">
        <h1 class="text-4xl font-bold">
            Stay Ahead Of The <span class="text-yellow-400">CRYPTO</span> Market
        </h1>

        <p class="mt-4 text-gray-400">
            Real-time crypto prices with clean UI
        </p>

        <a href="allcurrency.html" class="inline-block mt-6 px-6 py-3 bg-yellow-400 text-black rounded-lg font-bold">
            Explore More
        </a>
    </section>

    <!-- Coins -->
    <div class="coin-list flex justify-center gap-6 mt-14"></div>

    <div id="chat-toggle">💬</div>

    <div id="chat-widget" class="hidden">
        <div class="chat-header">
            <span>AI Assistant</span>
            <button id="chat-close">✕</button>
        </div>

        <div class="chat-container"></div>

        <div class="prompt-area">
            <input id="chat-input" class="prompt" type="text" />
            <button id="chat-send" class="btn">Send</button>
        </div>
    </div>
    <script src="./js/chatbot.js"></script>

    <script src="./js/cryptoApp.js"></script>
</body>

</html>
